[project]
name = "pdfu"
version = "2.0.0"
description = "PDF Utility — desktop app for PDF operations"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7.0",
    "pikepdf>=9.0.0",
    "PyMuPDF>=1.24.0",
    "pdf2docx>=0.5.8",
    "img2pdf>=0.5.1",
    "Pillow>=10.0.0",
    "requests>=2.31.0",
    "python-docx>=1.1.0",
    "lxml>=5.0.0",
]

[tool.uv]
package = false
dev-dependencies = [
    "pyinstaller>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
